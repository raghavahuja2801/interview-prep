apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-prep-api
  namespace: interview-prep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interview-prep-api
  template:
    metadata:
      labels:
        app: interview-prep-api
    spec:
      containers:
        - name: api
          image: interview-prep-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: uri
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: REDIS_URL
              value: "redis://redis.redis.svc.cluster.local:6379"
            - name: AUTH_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-admin-key
                  key: admin-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deepseek-key
                  key: api-key
            - name: FISH_AUDIO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fish-audio
                  key: api-key
            - name: FISH_VOICE_ID
              valueFrom:
                secretKeyRef:
                  name: fish-audio
                  key: voice-id
            - name: PLANTUML_ENDPOINT
              value: "http://plantuml.infrastructure.svc:80"
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc:9000"
            - name: MINIO_ACCESS_KEY
              value: "7JRV2A/PcRuEEYm7tYat/6wEfjv1CJEye7uBm4bHGmQ="
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
            - name: MINIO_BUCKET
              value: "interview-prep"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
