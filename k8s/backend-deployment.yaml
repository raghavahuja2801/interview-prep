apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-prep-api
  namespace: interview-prep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interview-prep-api
  template:
    metadata:
      labels:
        app: interview-prep-api
    spec:
      containers:
        - name: api
          image: interview-prep-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: MONGO_URI
              value: "mongodb://admin:Raghav3214!@mongodb.mongodb.svc.cluster.local:27017/interview-prep?authSource=admin"
            - name: POSTGRES_URL
              value: "postgres://interview_prep:change-me@postgres.postgres.svc.cluster.local:5432/interview_prep"
            - name: AUTH_ADMIN_KEY
              value: "CopOJdxsQZbAP2WQt1jPsmBdMTCrWa9hXyZl6r1lLk4="
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deepseek-key
                  key: api-key
            - name: PLANTUML_ENDPOINT
              value: "http://plantuml.infrastructure.svc:80"
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc:9000"
            - name: MINIO_ACCESS_KEY
              value: "admin"
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
            - name: MINIO_BUCKET
              value: "interview-prep"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
