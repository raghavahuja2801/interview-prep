# Example of the secrets the interview-prep namespace needs.
#
# Copy this to `k8s/secrets.yaml` (which is gitignored) and fill in real
# values, then apply:
#   kubectl apply -f k8s/secrets.yaml
#
# `stringData` accepts plaintext values — k8s encodes them to base64 for you.
# Keep the real `k8s/secrets.yaml` out of git (see .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: interview-prep
type: Opaque
stringData:
  uri: mongodb://admin:change-me@mongodb.mongodb.svc.cluster.local:27017/interview-prep?authSource=admin
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: interview-prep
type: Opaque
stringData:
  url: postgres://interview_prep:change-me@postgres.postgres.svc.cluster.local:5432/interview_prep
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-admin-key
  namespace: interview-prep
type: Opaque
stringData:
  admin-key: change-me
