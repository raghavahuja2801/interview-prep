apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-prep-frontend
  namespace: interview-prep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interview-prep-frontend
  template:
    metadata:
      labels:
        app: interview-prep-frontend
    spec:
      containers:
        - name: frontend
          image: interview-prep-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
